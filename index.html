<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donald Trump</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eee;
            font-family: Georgia, "Times New Roman", serif;
        }

        .container {
            width: 430px;
            height: 430px;
            margin: 20px auto;
            position: relative;
            overflow: hidden;
        }

        .container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .text-box {
            position: absolute;
            left: 0;
            bottom: 55px;
            width: 100%;

            padding: 28px;

            background: rgba(0, 0, 0, 0.65);

            color: white;
            font-size: 22px;
        }
    </style>
</head>

<body>

    <div class="container">

        <img
            src="https://commons.wikimedia.org/wiki/Special:FilePath/Official%20Presidential%20Portrait%20of%20President%20Donald%20J.%20Trump%20%282025%29.jpg"
            alt="Donald Trump"
        >

        <div class="text-box">
            bịa bịa
        </div>

    </div>

</body>
</html>
