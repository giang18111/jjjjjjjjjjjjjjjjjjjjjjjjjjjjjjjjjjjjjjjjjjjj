<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Hoa sen</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f2f2f2;
        font-family: Georgia, "Times New Roman", serif;
    }

    .container {
        position: relative;
        width: 430px;
        height: 430px;
        overflow: hidden;
        border: 1px solid #ddd;
    }

    .container img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
    }

    .caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 55px;
        height: 84px;

        display: flex;
        align-items: center;
        padding-left: 28px;

        background: rgba(0, 0, 0, 0.58);
        color: #ddd;

        font-size: 22px;
        letter-spacing: 0.2px;
    }
</style>
</head>

<body>
    <div class="container">
        <img src="opacity.png" alt="Hoa sen">

        <div class="caption">
            Trong đầm gì đẹp bằng sen
        </div>
    </div>
</body>
</html>
